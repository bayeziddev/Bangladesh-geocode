<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated pulsing location marker in Bangladesh flag colors" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="pinFill" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#14C374"/>
      <stop offset="100%" stop-color="#006A4E"/>
    </radialGradient>
  </defs>

  <circle cx="110" cy="110" r="6" fill="#F42A41" opacity="0.85">
    <animate attributeName="r" values="6;95" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="110" r="6" fill="#F42A41" opacity="0.85">
    <animate attributeName="r" values="6;95" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;0" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="110" r="6" fill="#F42A41" opacity="0.85">
    <animate attributeName="r" values="6;95" dur="2.6s" begin="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;0" dur="2.6s" begin="1.8s" repeatCount="indefinite"/>
  </circle>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="1.8s" repeatCount="indefinite"/>
    <path d="M110,70 C125,70 137,82 137,97 C137,118 110,152 110,152 C110,152 83,118 83,97 C83,82 95,70 110,70 Z"
          fill="url(#pinFill)" stroke="#00402F" stroke-width="2"/>
    <circle cx="110" cy="97" r="11" fill="#ffffff"/>
  </g>
</svg>