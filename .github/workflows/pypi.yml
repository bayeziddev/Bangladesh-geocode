name: Publish bangladesh-geo-data to PyPI

on:
  push:
    tags:
      - "bangladesh-geo-data-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the current package version to PyPI"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Removed the working-directory block so commands run in the root directory
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          
      - name: Install build tools
        run: python -m pip install --upgrade build pytest

      - name: Install package (editable, for tests)
        run: python -m pip install -e .

      - name: Test package
        run: pytest

      - name: Build distributions
        run: python -m build
        
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: bangladesh-geo-data-dist
          # Changed to target the dist directory in the root
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/bangladesh-geo-data-v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bangladesh-geo-data
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: bangladesh-geo-data-dist
          path: dist/
          
      - name: Publish to PyPI using API Token
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PyPI requires the literal string '__token__' when using an API token.
          # Your identity (sayadbayezid) is verified via the token itself.
          user: __token__ 
          password: ${{ secrets.PYPI_MY_PROJECT_TOKEN }}
          packages-dir: dist/