name: Build and publish bangladesh-geo-data

on:
  push:
    tags:
      - "bangladesh-geo-data-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the current package version to PyPI"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

env:
  PACKAGE_NAME: bangladesh-geo-data

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/bangladesh-geo-data-v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bangladesh-geo-data
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-dist
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_MY_PROJECT_TOKEN }}
          packages-dir: dist/
