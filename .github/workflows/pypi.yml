name: Publish to PyPI

# Runs whenever a GitHub Release is published.
# To ship a new version: bump `version` in pyproject.toml, commit,
# then create a GitHub Release with a matching tag (e.g. v0.1.1).
on:
  release:
    types: [published]
  workflow_dispatch:  # lets you also run it manually from the Actions tab

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Run tests
        run: |
          python -m pip install pytest
          python -m pip install dist/*.whl
          pytest tests/ -v

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bangladesh-geo-data
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC) — no API token needed
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1