name: Test checkout frontend

on:
  push:
    branches: [main]
    paths:
      - "assets/checkout-autofill.mjs"
      - "tests/frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "assets/checkout-autofill.mjs"
      - "tests/frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Node.js checkout autocomplete tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run frontend tests
        run: node --test tests/frontend/checkout-autofill.test.mjs
