[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bangladesh-geo-data"
version = "0.1.0"
description = "Offline Bangladesh administrative geography with bilingual records, postal codes, and district GeoJSON boundaries."
readme = "PYPI-README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sayad Md Bayezid Hosan" }
]
requires-python = ">=3.9"
keywords = [
    "bangladesh", "geocode", "geodata", "geojson", "postal-code", "postcode",
    "division", "district", "upazila", "union", "administrative-boundaries", "bangla"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
    "Natural Language :: Bengali",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/bayeziddev/Bangladesh-geocode"
Documentation = "https://bayeziddev.github.io/Bangladesh-geocode/"
Repository = "https://github.com/bayeziddev/Bangladesh-geocode"
Issues = "https://github.com/bayeziddev/Bangladesh-geocode/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bangladesh_geo_data = ["data/*.json", "data/*.geojson"]
